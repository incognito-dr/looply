      gr.addColorStop(0,'rgba(0,0,0,.55)');gr.addColorStop(.18,'rgba(0,0,0,0)');
      gr.addColorStop(.32,'rgba(255,220,225,.05)');gr.addColorStop(.7,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.6)');
      ctx.fillStyle=gr;ctx.fillRect(x2,0,r,h);
    }
  }

  // progress: slow, eased, never 100
  var pc=document.getElementById('pc'),line=document.getElementById('line'),st=document.getElementById('st');
  var P=0,held=false;
  function progress(sec){
    var p=99*(1-Math.exp(-sec/26));
    if(p>=98.5){p=99;if(!held){held=true;st.textContent='todavía no'}}
    if(Math.floor(p)!==P){P=Math.floor(p);pc.textContent=String(P).padStart(2,'0');line.style.width=(P)+'%'}
  }

  function frame(now){
    var sec=(now-t0)/1000;
    mx+=(tx-mx)*.04;my+=(ty-my)*.04;
    var focus=Math.min(1,sec/40);                     // pulls focus over ~40s but never sharp
    var breath=Math.sin(sec*1.1)*.5+.5;               // heartbeat-ish
    var flick=Math.random()<.006?.55:1;               // rare light flicker
    var glow=Math.min(1,sec/3.2)*(.82+.18*breath)*flick;
    var blur=(42-26*focus)*(Math.min(W,H)/900)+breath*3;
    paintLight(blur,glow,breath);reeds();progress(sec);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  setTimeout(function(){document.body.classList.add('ready')},50);

  function tick(){var d=new Date(new Date().toLocaleString('en-US',{timeZone:'America/Santo_Domingo'}));
    document.getElementById('clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  tick();setInterval(tick,10000);
})();
</script>
